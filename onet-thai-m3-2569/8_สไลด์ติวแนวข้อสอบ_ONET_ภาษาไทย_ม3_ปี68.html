        let currentSlide = 0;

        function renderSlides() {
            const container = document.getElementById('slidesContainer');
            const selector = document.getElementById('slideSelector');
            container.innerHTML = '';
            selector.innerHTML = '';

            slidesData.forEach((s, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = s.menuTitle;
                selector.appendChild(opt);

                let bodyHtml = s.html || '';
                if (s.isQuiz) {
                    const passageHtml = s.passage ? `<div class="passage-box">${s.passage}</div>` : '';
                    const poemHtml = s.poem
                        ? `<div class="poem-box">${s.poem.map(([a, b]) => `<span>${a}</span><span>${b}</span>`).join('')}</div>`
                        : '';

                    let interactiveHtml = '';
                    if (s.quizType === 'single') {
                        interactiveHtml = `<div class="choices-grid">${s.choices.map((c, i) => `
                            <button class="choice-btn" id="${s.quizId}_c${i}" onclick="selectSingle('${s.quizId}', ${i}, ${s.correctIndex})">
                                <span>${c}</span><span class="choice-status"></span>
                            </button>`).join('')}</div>`;

                        interactiveHtml = `

                            <div class="choices-grid">${s.choices.map((c, i) => `

                            </button>`).join('')}</div>`;
                    } else if (s.quizType === 'match') {
                        interactiveHtml = `

                            <div class="match-grid">
                                <div class="match-col">
                                    <h4>หมวด ก. (เลือก ๑ คำตอบ)</h4>
                                    <div class="choices-grid" style="margin-bottom:0;">

                                            <button class="choice-btn" id="${s.quizId}_a${i}" onclick="selectMatch('${s.quizId}', 'a', ${i}, ${s.correctA}, ${s.correctB})">
                                                <span>${c}</span><span class="choice-status"></span>
                                            </button>
                                        `).join('')}
                                    </div>
                                </div>
                                <div class="match-col">
                                    <h4>หมวด ข. (เลือก ๑ คำตอบ)</h4>
                                    <div class="choices-grid" style="margin-bottom:0;">
                                        ${s.groupB.map((c, i) => `
                                            <button class="choice-btn" id="${s.quizId}_b${i}" onclick="selectMatch('${s.quizId}', 'b', ${i}, ${s.correctA}, ${s.correctB})">
                                                <span>${c}</span><span class="choice-status"></span>
                                            </button>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>`;
                    }

                    bodyHtml = `
                        ${passageHtml}
                        ${poemHtml}
                        ${interactiveHtml}
                        <div class="answer-panel" id="ans_${s.quizId}">${s.explanation}</div>
                    `;
                }

                const slideEl = document.createElement('div');
                slideEl.className = 'slide' + (s.type === 'cover' ? ' cover-slide' : '') + (idx === 0 ? ' active' : '');
                slideEl.id = 'slide_' + idx;

                if (s.type === 'cover') {
                    slideEl.innerHTML = bodyHtml;
                } else {
                    slideEl.innerHTML = `

                            <div class="slide-title">${s.title}</div>
                            <div class="strand-tag">${s.strand}</div>

        function updateUI() {
            document.querySelectorAll('.slide').forEach((el, idx) => el.classList.toggle('active', idx === currentSlide));
            document.getElementById('slideSelector').value = currentSlide;
            document.getElementById('slideCounter').textContent = `${currentSlide + 1} / ${slidesData.length}`;
            const revealBtn = document.getElementById('globalRevealBtn');
            revealBtn.style.display = slidesData[currentSlide].isQuiz ? 'inline-block' : 'none';
        }

        function nextSlide() { if (currentSlide < slidesData.length - 1) { currentSlide++; updateUI(); } }
        function prevSlide() { if (currentSlide > 0) { currentSlide--; updateUI(); } }
        function goToSlide(idx) { currentSlide = parseInt(idx, 10); updateUI(); }

        function selectSingle(qId, cIdx, correctIdx) {
            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`${qId}_c${i}`);
                btn.classList.remove('correct-revealed', 'wrong-selected');
                btn.querySelector('.choice-status').textContent = '';
            }
            const clickedEl = document.getElementById(`${qId}_c${cIdx}`);
            const correctEl = document.getElementById(`${qId}_c${correctIdx}`);
            const panel = document.getElementById(`ans_${qId}`);
            if (cIdx === correctIdx) {
                clickedEl.classList.add('correct-revealed');
                clickedEl.querySelector('.choice-status').textContent = '✅ ถูกต้อง!';
            } else {
                clickedEl.classList.add('wrong-selected');
                clickedEl.querySelector('.choice-status').textContent = '❌ ยังไม่ถูก';
                correctEl.classList.add('correct-revealed');
                correctEl.querySelector('.choice-status').textContent = '✅ คำตอบที่ถูก';
            }
            panel.classList.add('visible');
        }

        function toggleMulti(qId, cIdx, corrects) {
            if (!multiState[qId]) multiState[qId] = new Set();
            const sel = multiState[qId];
            const el = document.getElementById(`${qId}_c${cIdx}`);
            if (sel.has(cIdx)) {
                sel.delete(cIdx);
                el.classList.remove('selected-multi');
                el.querySelector('.choice-status').textContent = '';
            } else if (sel.size < 2) {
                sel.add(cIdx);
                el.classList.add('selected-multi');
                el.querySelector('.choice-status').textContent = '☑️ เลือกแล้ว';
            }
            if (sel.size === 2) {
                for (let i = 0; i < 5; i++) {
                    const btn = document.getElementById(`${qId}_c${i}`);
                    btn.classList.remove('selected-multi', 'correct-revealed', 'wrong-selected');
                    if (corrects.includes(i)) {
                        btn.classList.add('correct-revealed');
                        btn.querySelector('.choice-status').textContent = '✅ คำตอบที่ถูก';
                    } else if (sel.has(i)) {
                        btn.classList.add('wrong-selected');
                        btn.querySelector('.choice-status').textContent = '❌ ยังไม่ถูก';
                    } else {
                        btn.querySelector('.choice-status').textContent = '';
                    }
                }
                document.getElementById(`ans_${qId}`).classList.add('visible');
            }
        }

        function selectMatch(qId, group, idx, correctA, correctB) {
            if (!matchState[qId]) matchState[qId] = {};
            matchState[qId][group] = idx;
            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`${qId}_${group}${i}`);
                btn.classList.remove('selected-multi', 'correct-revealed', 'wrong-selected');
                btn.querySelector('.choice-status').textContent = '';
            }
            const selBtn = document.getElementById(`${qId}_${group}${idx}`);
            selBtn.classList.add('selected-multi');
            selBtn.querySelector('.choice-status').textContent = '☑️ เลือกแล้ว';

            if (matchState[qId].a !== undefined && matchState[qId].b !== undefined) {
                [['a', correctA], ['b', correctB]].forEach(([g, corr]) => {
                    for (let i = 0; i < 4; i++) {
                        const btn = document.getElementById(`${qId}_${g}${i}`);
                        btn.classList.remove('selected-multi');
                        if (i === corr) {
                            btn.classList.add('correct-revealed');
                            btn.querySelector('.choice-status').textContent = '✅ คำตอบที่ถูก';
                        } else if (matchState[qId][g] === i) {
                            btn.classList.add('wrong-selected');
                            btn.querySelector('.choice-status').textContent = '❌ ยังไม่ถูก';
                        }
                    }
                });
                document.getElementById(`ans_${qId}`).classList.add('visible');
            }
        }

        function toggleCurrentAnswer() {
            const s = slidesData[currentSlide];
            if (!s.isQuiz) return;
            const panel = document.getElementById(`ans_${s.quizId}`);
            const isShowing = panel.classList.toggle('visible');
            if (s.quizType === 'single') {
                const correctEl = document.getElementById(`${s.quizId}_c${s.correctIndex}`);
                correctEl.classList.toggle('correct-revealed', isShowing);
                correctEl.querySelector('.choice-status').textContent = isShowing ? '✅ คำตอบที่ถูก' : '';
            } else if (s.quizType === 'multi') {
                s.corrects.forEach(idx => {
                    const correctEl = document.getElementById(`${s.quizId}_c${idx}`);
                    correctEl.classList.toggle('correct-revealed', isShowing);
                    correctEl.querySelector('.choice-status').textContent = isShowing ? '✅ คำตอบที่ถูก' : '';
                });
            } else if (s.quizType === 'match') {
                [['a', s.correctA], ['b', s.correctB]].forEach(([g, corr]) => {
                    const correctEl = document.getElementById(`${s.quizId}_${g}${corr}`);
                    correctEl.classList.toggle('correct-revealed', isShowing);
                    correctEl.querySelector('.choice-status').textContent = isShowing ? '✅ คำตอบที่ถูก' : '';
                });
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
            else document.exitFullscreen().catch(() => {});
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown') nextSlide();
            else if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
            else if (e.key === ' ') { e.preventDefault(); toggleCurrentAnswer(); }
        });

        renderSlides();
    </script>
</body>
</html>
